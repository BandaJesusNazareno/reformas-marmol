<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide">REFORMAS MÁRMOL</h1>
            <p class="text-xs text-red-200">Control de Personal y Obras</p>
        </div>
        <div>
            <button id="adminToggleBtn" onclick="toggleAdminModal()" class="bg-red-800 hover:bg-red-900 border border-red-500 text-xs px-3 py-1.5 rounded font-semibold transition">
                🔒 Vista Consulta
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">

        <!-- TAB 1: DESPLIEGUE DIARIO -->
        <div id="tab-despliegue" class="tab-content active space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha de Despliegue</label>
                <input type="date" id="fechaDespliegue" class="w-full p-2 border rounded-lg bg-slate-50 text-sm font-semibold" onchange="cargarDespliegue()">
            </div>

            <div id="listaObrasDespliegue" class="space-y-4">
                <p class="text-xs text-slate-400 text-center py-4">Cargando datos...</p>
            </div>
        </div>

        <!-- TAB 2: PLANTILLA -->
        <div id="tab-plantilla" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-700">Trabajadores</h2>
                <button onclick="abrirModalTrabajador()" id="btnNuevoTrabajador" class="hidden bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow hover:bg-red-700">+ Añadir Operario</button>
            </div>
            <div id="listaPlantilla" class="space-y-2">
                <p class="text-xs text-slate-400 text-center py-4">No hay operarios registrados aún.</p>
            </div>
        </div>

        <!-- TAB 3: OBRAS -->
        <div id="tab-obras" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-700">Listado de Obras</h2>
                <button onclick="abrirModalObra()" id="btnNuevaObra" class="hidden bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow hover:bg-red-700">+ Nueva Obra</button>
            </div>
            <div id="listaObras" class="space-y-3">
                <p class="text-xs text-slate-400 text-center py-4">No hay obras registradas aún.</p>
            </div>
        </div>

        <!-- TAB 4: FICHAJES -->
        <div id="tab-fichajes" class="tab-content space-y-4">
